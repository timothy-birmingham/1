services:
  app:
    image: vesta-it-equipment-dev
    build:
      context: .
      dockerfile: Dockerfile.dev

    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - sqlite_data:/app/data

    env_file:
      - path: .env
        required: false

    environment:
      # Always matches the sqlite_data volume mount above, regardless of
      # whatever DATABASE_URL (if any) is set in .env.
      DATABASE_URL: file:/app/data/dev.db

    stdin_open: true
    tty: true

    command: ["sh", "docker-entrypoint.dev.sh"]

volumes:
  node_modules:
  next_cache:
  sqlite_data: